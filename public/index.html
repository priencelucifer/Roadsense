<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>RoadSense Live Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-headline { font-family: 'Space+Grotesk', sans-serif; }
        #map { height: 100%; width: 100%; position: absolute; top: 0; bottom: 0; }
        .mapboxgl-popup-content { background: #18181b; color: white; border: 1px solid #27272a; border-radius: 12px; }
        .drive-mode-overlay { pointer-events: none; border: 4px solid #ef4444; z-index: 100; display: none; }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-hidden flex flex-col h-screen">
    <div id="driveModeBorder" class="fixed inset-0 drive-mode-overlay"></div>

    <!-- Top Bar -->
    <header class="p-4 bg-zinc-900 border-b border-zinc-800 flex justify-between items-center z-30">
        <h1 class="text-xl font-bold font-headline tracking-tighter text-red-500">RoadSense</h1>
        <button id="driveModeBtn" onclick="toggleDriveMode()" class="bg-zinc-800 px-4 py-1.5 rounded-full text-xs font-bold border border-zinc-700 active:scale-95 transition flex items-center gap-2">
            <span class="material-symbols-outlined text-sm">directions_car</span>
            DRIVE MODE: OFF
        </button>
    </header>

    <div class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
        <!-- Sidebar (Hazard List) -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 w-full lg:w-80 bg-zinc-900 border-r border-zinc-800 flex flex-col z-40 shadow-2xl transition-transform duration-300 -translate-x-full lg:translate-x-0 lg:static">
            <div class="p-6 border-b border-zinc-800 flex justify-between items-center">
                <h1 class="text-xl font-bold font-headline tracking-tighter text-red-500">RoadSense</h1>
                <button onclick="toggleSidebar()" class="lg:hidden p-2 -mr-2 text-zinc-400 hover:text-white">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-4">
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500">search</span>
                    <input id="searchInput" type="text" placeholder="Search City..." class="w-full bg-zinc-800 border-zinc-700 rounded-xl py-3 pl-10 pr-4 text-sm focus:ring-red-500 focus:border-red-500 border appearance-none">
                </div>
            </div>
            <div id="hazardList" class="flex-1 overflow-y-auto p-4 space-y-3 pb-24 lg:pb-4">
                <!-- Hazards list -->
            </div>
        </aside>

        <!-- Main Content (Map) -->
        <main class="flex-1 relative">
            <div id="map"></div>
            
            <div class="absolute bottom-24 right-4 lg:bottom-6 lg:right-6 z-20 flex flex-col gap-3">
                <button onclick="fetchHazards()" class="bg-zinc-900/90 backdrop-blur-md p-3 rounded-full border border-zinc-800 text-white shadow-2xl active:scale-90 transition">
                    <span class="material-symbols-outlined">refresh</span>
                </button>
                <button id="geolocateBtn" class="bg-red-600 p-3 rounded-full text-white shadow-2xl active:scale-90 transition">
                    <span class="material-symbols-outlined">my_location</span>
                </button>
            </div>
        </main>
    </div>

    <!-- Bottom Navigation -->
    <nav id="bottomNav" class="lg:hidden grid grid-cols-3 bg-zinc-900/95 backdrop-blur-lg border-t border-zinc-800 h-16 z-50 fixed bottom-0 left-0 right-0">
        <button onclick="showMap()" id="navMap" class="flex flex-col items-center justify-center text-red-500">
            <span class="material-symbols-outlined">map</span>
            <span class="text-[10px] font-bold uppercase mt-0.5">Map</span>
        </button>
        <button onclick="toggleSidebar()" id="navHazards" class="flex flex-col items-center justify-center text-zinc-400">
            <span class="material-symbols-outlined">warning</span>
            <span class="text-[10px] font-bold uppercase mt-0.5">Hazards</span>
        </button>
        <button onclick="focusSearch()" class="flex flex-col items-center justify-center text-zinc-400">
            <span class="material-symbols-outlined">search</span>
            <span class="text-[10px] font-bold uppercase mt-0.5">Search</span>
        </button>
    </nav>

    <!-- Capacitor JS -->
    <script src="capacitor.js"></script>
    <script>
        const API_BASE = 'https://main.roadsense-dashboard.pages.dev';
        const MAPBOX_TOKEN = 'pk.eyJ1Ijoicmlja3k5NjY5IiwiYSI6ImNtbjRwZm1odDAyZjYycnM5dmNybWxqZG0ifQ.W9UjjaYKr6l7bNxuSdHQZA';
        mapboxgl.accessToken = MAPBOX_TOKEN;

        // Capacitor Plugins
        const { Geolocation } = Capacitor.Plugins;
        const { TextToSpeech } = Capacitor.Plugins;

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [91.7362, 26.1445],
            zoom: 11,
            attributionControl: false
        });

        let markers = [];
        let hazardsData = [];
        let isDriveMode = false;
        let watchId = null;

        async function speak(text) {
            try {
                await TextToSpeech.speak({
                    text: text,
                    lang: 'en-US',
                    rate: 1.0,
                    pitch: 1.0,
                    volume: 1.0,
                    category: 'ambient'
                });
            } catch (e) {
                console.error('Speech error', e);
            }
        }

        async function toggleDriveMode() {
            isDriveMode = !isDriveMode;
            const btn = document.getElementById('driveModeBtn');
            const border = document.getElementById('driveModeBorder');

            if (isDriveMode) {
                btn.classList.replace('bg-zinc-800', 'bg-red-600');
                btn.innerHTML = `<span class="material-symbols-outlined text-sm">directions_car</span> DRIVE MODE: ON`;
                border.style.display = 'block';
                await speak("Drive mode activated. Monitoring for road hazards.");
                startTracking();
            } else {
                btn.classList.replace('bg-red-600', 'bg-zinc-800');
                btn.innerHTML = `<span class="material-symbols-outlined text-sm">directions_car</span> DRIVE MODE: OFF`;
                border.style.display = 'none';
                stopTracking();
            }
        }

        async function startTracking() {
            watchId = await Geolocation.watchPosition({
                enableHighAccuracy: true,
                timeout: 5000
            }, (position, err) => {
                if (err) return;
                const { latitude, longitude } = position.coords;
                checkProximity(latitude, longitude);
                map.setCenter([longitude, latitude]);
            });
        }

        function stopTracking() {
            if (watchId) {
                Geolocation.clearWatch({ id: watchId });
                watchId = null;
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // meters
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        let lastAlertTime = 0;
        function checkProximity(lat, lng) {
            hazardsData.forEach(h => {
                const dist = calculateDistance(lat, lng, h.lat, h.lng);
                if (dist < 50 && (Date.now() - lastAlertTime > 10000)) { // 50 meters, 10s cooldown
                    speak(`Warning! ${h.type} ahead.`);
                    lastAlertTime = Date.now();
                }
            });
        }

        async function fetchHazards(query = '') {
            const url = query ? `${API_BASE}/api/search?q=${encodeURIComponent(query)}` : `${API_BASE}/api/hazards`;
            const res = await fetch(url);
            const data = await res.json();
            hazardsData = data;
            
            markers.forEach(m => m.remove());
            markers = [];
            const list = document.getElementById('hazardList');
            list.innerHTML = '';

            data.forEach(h => {
                const el = document.createElement('div');
                el.className = 'w-3 h-3 rounded-full border-2 border-white shadow-lg ' + (h.severity > 7 ? 'bg-red-500 animate-pulse' : 'bg-yellow-500');
                const marker = new mapboxgl.Marker(el).setLngLat([h.lng, h.lat]).addTo(map);
                markers.push(marker);

                const item = document.createElement('div');
                item.className = 'p-4 bg-zinc-800/50 rounded-xl border border-zinc-700/50 cursor-pointer active:scale-95';
                item.onclick = () => {
                    map.flyTo({ center: [h.lng, h.lat], zoom: 15 });
                    if (window.innerWidth < 1024) toggleSidebar();
                };
                item.innerHTML = `<div class="flex justify-between">
                    <span class="text-xs font-bold uppercase ${h.severity > 7 ? 'text-red-500' : 'text-yellow-500'}">${h.type}</span>
                    <span class="text-xs text-zinc-500">${h.severity}g</span>
                </div>`;
                list.appendChild(item);
            });
        }

        // Standard Mobile Nav
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function showMap() { document.getElementById('sidebar').classList.add('-translate-x-full'); }
        function focusSearch() { 
            document.getElementById('sidebar').classList.remove('-translate-x-full');
            setTimeout(() => document.getElementById('searchInput').focus(), 300);
        }

        document.getElementById('geolocateBtn').onclick = async () => {
            const pos = await Geolocation.getCurrentPosition();
            map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 16 });
        };

        map.on('load', fetchHazards);
    </script>
</body>
</html>
