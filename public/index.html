<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>RoadSense Live Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-headline { font-family: 'Space+Grotesk', sans-serif; }
        #map { height: 100%; width: 100%; position: absolute; top: 0; bottom: 0; }
        .mapboxgl-popup-content { background: #18181b; color: white; border: 1px solid #27272a; border-radius: 12px; }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-hidden flex flex-col h-screen">
    <!-- Top Bar (Mobile) -->
    <header class="lg:hidden p-4 bg-zinc-900 border-b border-zinc-800 flex justify-between items-center z-30">
        <h1 class="text-xl font-bold font-headline tracking-tighter text-red-500">RoadSense</h1>
    </header>

    <div class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
        <!-- Sidebar (Hazard List) -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 w-full lg:w-80 bg-zinc-900 border-r border-zinc-800 flex flex-col z-40 shadow-2xl transition-transform duration-300 -translate-x-full lg:translate-x-0 lg:static">
            <div class="p-6 border-b border-zinc-800 flex justify-between items-center">
                <h1 class="text-xl font-bold font-headline tracking-tighter text-red-500">RoadSense</h1>
                <button onclick="toggleSidebar()" class="lg:hidden p-2 -mr-2 text-zinc-400 hover:text-white">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-4">
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500">search</span>
                    <input id="searchInput" type="text" placeholder="Search City..." class="w-full bg-zinc-800 border-zinc-700 rounded-xl py-3 pl-10 pr-4 text-sm focus:ring-red-500 focus:border-red-500 border appearance-none">
                </div>
            </div>
            <div id="hazardList" class="flex-1 overflow-y-auto p-4 space-y-3 pb-24 lg:pb-4">
                <!-- Hazards list -->
            </div>
        </aside>

        <!-- Main Content (Map) -->
        <main class="flex-1 relative">
            <div id="map"></div>
            
            <!-- Floating Action Buttons -->
            <div class="absolute bottom-20 right-4 lg:bottom-6 lg:right-6 z-20 flex flex-col gap-3">
                <button onclick="fetchHazards()" class="bg-zinc-900/90 backdrop-blur-md p-3 rounded-full border border-zinc-800 text-white shadow-2xl active:scale-90 transition">
                    <span class="material-symbols-outlined">refresh</span>
                </button>
                <button id="geolocateBtn" class="bg-red-600 p-3 rounded-full text-white shadow-2xl active:scale-90 transition">
                    <span class="material-symbols-outlined">my_location</span>
                </button>
            </div>
        </main>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <nav id="bottomNav" class="lg:hidden grid grid-cols-3 bg-zinc-900/95 backdrop-blur-lg border-t border-zinc-800 h-16 z-50 fixed bottom-0 left-0 right-0">
        <button onclick="showMap()" id="navMap" class="flex flex-col items-center justify-center text-red-500 transition-colors">
            <span class="material-symbols-outlined">map</span>
            <span class="text-[10px] font-bold uppercase mt-0.5">Map</span>
        </button>
        <button onclick="toggleSidebar()" id="navHazards" class="flex flex-col items-center justify-center text-zinc-400 transition-colors">
            <span class="material-symbols-outlined">warning</span>
            <span class="text-[10px] font-bold uppercase mt-0.5">Hazards</span>
        </button>
        <button onclick="focusSearch()" class="flex flex-col items-center justify-center text-zinc-400 transition-colors">
            <span class="material-symbols-outlined">search</span>
            <span class="text-[10px] font-bold uppercase mt-0.5">Search</span>
        </button>
    </nav>

    <script>
        const MAPBOX_TOKEN = 'pk.eyJ1Ijoicmlja3k5NjY5IiwiYSI6ImNtbjRwZm1odDAyZjYycnM5dmNybWxqZG0ifQ.W9UjjaYKr6l7bNxuSdHQZA';
        mapboxgl.accessToken = MAPBOX_TOKEN;
        
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [91.7362, 26.1445], // Default: Guwahati
            zoom: 11,
            attributionControl: false
        });

        const geolocate = new mapboxgl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true
        });
        map.addControl(geolocate);
        // Hide the default button to use our custom one
        geolocate.on('geolocate', () => {}); 
        document.getElementById('geolocateBtn').onclick = () => geolocate.trigger();

        let markers = [];

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const isClosing = !sidebar.classList.contains('-translate-x-full');
            sidebar.classList.toggle('-translate-x-full');
            
            // Update nav colors
            document.getElementById('navHazards').classList.toggle('text-red-500', !isClosing);
            document.getElementById('navHazards').classList.toggle('text-zinc-400', isClosing);
            document.getElementById('navMap').classList.toggle('text-zinc-400', !isClosing);
            document.getElementById('navMap').classList.toggle('text-red-500', isClosing);
        }

        function showMap() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.add('-translate-x-full');
            document.getElementById('navHazards').className = 'flex flex-col items-center justify-center text-zinc-400 transition-colors';
            document.getElementById('navMap').className = 'flex flex-col items-center justify-center text-red-500 transition-colors';
        }

        function focusSearch() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.remove('-translate-x-full');
            setTimeout(() => document.getElementById('searchInput').focus(), 300);
            document.getElementById('navHazards').className = 'flex flex-col items-center justify-center text-red-500 transition-colors';
            document.getElementById('navMap').className = 'flex flex-col items-center justify-center text-zinc-400 transition-colors';
        }

        async function geocodeAndFly(query) {
            const geocodeUrl = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${MAPBOX_TOKEN}&limit=1`;
            const geoRes = await fetch(geocodeUrl);
            const geoData = await geoRes.json();
            
            if (geoData.features && geoData.features.length > 0) {
                const [lng, lat] = geoData.features[0].center;
                map.flyTo({ center: [lng, lat], zoom: 16 });
                if (window.innerWidth < 1024) toggleSidebar();
            }
        }

        async function fetchHazards(query = '') {
            // Geocode city first if query is present
            if (query) await geocodeAndFly(query);

            const url = query ? `/api/search?q=${encodeURIComponent(query)}` : '/api/hazards';
            const res = await fetch(url);
            const data = await res.json();
            
            // Clear markers
            markers.forEach(m => m.remove());
            markers = [];
            
            const list = document.getElementById('hazardList');
            list.innerHTML = '';

            data.forEach(h => {
                const el = document.createElement('div');
                el.className = 'w-3 h-3 rounded-full border-2 border-white shadow-lg ' + 
                    (h.severity > 7 ? 'bg-red-500 animate-pulse' : 'bg-yellow-500');
                
                const marker = new mapboxgl.Marker(el)
                    .setLngLat([h.lng, h.lat])
                    .setPopup(new mapboxgl.Popup({ offset: 15 }).setHTML(`
                        <div class="p-1">
                            <h3 class="font-bold text-red-400 text-sm uppercase">${h.type}</h3>
                            <div class="mt-1 border-t border-zinc-700 pt-1">
                                <span class="text-xs text-zinc-400">SEVERITY:</span>
                                <span class="text-sm font-bold ml-1">${h.severity}g</span>
                            </div>
                        </div>
                    `))
                    .addTo(map);
                markers.push(marker);

                const item = document.createElement('div');
                item.className = 'p-4 bg-zinc-800/50 rounded-xl border border-zinc-700/50 cursor-pointer hover:bg-zinc-800 transition active:scale-95';
                item.onclick = () => {
                    map.flyTo({ center: [h.lng, h.lat], zoom: 15 });
                    if (window.innerWidth < 1024) toggleSidebar();
                };
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-xs font-bold uppercase tracking-wider ${h.severity > 7 ? 'text-red-500' : 'text-yellow-500'}">${h.type}</span>
                        <span class="text-xs text-zinc-500">${h.severity}g</span>
                    </div>
                    <p class="text-[10px] text-zinc-500 mt-1 uppercase font-bold">LAT: ${h.lat.toFixed(4)} | LNG: ${h.lng.toFixed(4)}</p>
                `;
                list.appendChild(item);
            });
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchHazards(e.target.value);
        });

        map.on('load', () => {
            fetchHazards();
        });
    </script>
</body>
</html>
